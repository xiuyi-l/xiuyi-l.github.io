<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>朽一的个人主页</title>
    <!-- 下面这一块是样式（CSS），就是给网页穿衣服 -->
    <style>
        body {
            background-color: #1a1a1a; /* 深色背景 */
            color: white;              /* 白色文字 */
            font-family: sans-serif;   /* 字体 */
            display: flex;             /* 用来居中的魔法 */
            justify-content: center;
            align-items: center;
            height: 100vh;             /* 占满整个屏幕高度 */
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #4CAF50;            /* 标题变成绿色 */
            font-size: 3em;
        }
        p {
            font-size: 1.2em;
            color: #cccccc;
        }
    </style>
</head>
<body>
    <div>
        <h1>你好，我是朽一！</h1>
        <p>这是我的第一个 GitHub Pages 网页。</p>
        <p>代码虽少，但这可是通往赛博世界的第一步。</p>
    </div>
</body>
</html>
